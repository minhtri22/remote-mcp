name: RemoteMCP Gateway Updater Fail-safe QA

on:
  pull_request:
    paths:
      - "Update-RemoteMCP-Gateway.ps1"
      - "tests/test_gateway_recovery_scripts.py"
      - "tests/test_public_repo_hygiene.py"
      - "docs/REMOTEMCP_GATEWAY_UPDATER_FAILSAFE_HARDENING.md"
      - ".github/workflows/gateway-updater-failsafe-qa.yml"
  workflow_dispatch:

jobs:
  failsafe-qa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install gateway and test dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check "mcp[cli]<2" uvicorn "httpx==0.28.1" "cryptography==46.0.6" pytest

      - name: PowerShell parse preflight
        shell: powershell
        run: |
          [scriptblock]::Create((Get-Content -Raw .\Update-RemoteMCP-Gateway.ps1)) | Out-Null

      - name: Execute updater preflight-only with synthetic config
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $base = Join-Path $env:LOCALAPPDATA "RemoteMCP"
          New-Item -ItemType Directory -Force -Path $base | Out-Null

          $releaseParent = Join-Path $env:RUNNER_TEMP "releases"
          $oldSource = Join-Path $releaseParent "synthetic-old"
          $root = Join-Path $env:RUNNER_TEMP "workspace"
          $runtime = Join-Path $env:RUNNER_TEMP "runtime"
          New-Item -ItemType Directory -Force -Path $oldSource,$root,$runtime | Out-Null

          $python = (Get-Command python).Source
          $cfg = [ordered]@{
            schema_version = 2
            source_dir = $oldSource
            python_exe = $python
            port = 18080
            public_url = "https://diagnostic.invalid"
            mcp_root = $root
            state_file = (Join-Path $env:RUNNER_TEMP "oauth-state.json")
            runtime_dir = $runtime
            allowed_redirect_hosts = "chatgpt.com,localhost,127.0.0.1"
          }
          $cfg | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 (Join-Path $base "gateway-config.json")

          .\Update-RemoteMCP-Gateway.ps1 -SourceRepo $PWD -Ref HEAD -SkipFetch -PreflightOnly

      - name: Targeted recovery and public-hygiene QA
        shell: powershell
        run: |
          python -m pytest -q tests/test_gateway_recovery_scripts.py tests/test_public_repo_hygiene.py
