name: Physical process safety QA

on:
  pull_request:
    paths:
      - "remotemcp/node/process_safety.py"
      - "remotemcp/node/service.py"
      - "remotemcp/routing/service.py"
      - "remotemcp/routing/config.py"
      - "Start-RemoteMCP-Node.ps1"
      - "Watch-RemoteMCP-Node.ps1"
      - "Install-RemoteMCP-Node-Supervisor.ps1"
      - "Migrate-RemoteMCP-Node-ZeroC.ps1"
      - "skills/remote-mcp/SKILL.md"
      - "skills/remote-mcp/managed_execution_policy.json"
      - "tests/v2bd/test_physical_process_safety.py"
      - "tests/v2bd/test_node_reconnect.py"
      - "tests/v2bd/test_v31_scientific_observability.py"
      - ".github/workflows/physical-process-safety-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pytest "mcp[cli]<2" uvicorn httpx==0.28.1 cryptography==46.0.6
      - name: Physical process safety unit and platform smoke QA
        run: python -m pytest -q tests/v2bd/test_physical_process_safety.py
      - name: Node reconnect sampler QA
        run: python -m pytest -q tests/v2bd/test_node_reconnect.py
      - name: V3.1 upgrade and restart gate QA
        run: python -m pytest -q tests/v2bd/test_v31_scientific_observability.py
      - name: Full V2-B regression
        run: python -m pytest -q tests/v2b
      - name: Full V2-BD regression
        run: python -m pytest -q tests/v2bd
      - name: Python syntax preflight
        run: python -m py_compile remotemcp/node/process_safety.py remotemcp/node/service.py remotemcp/routing/config.py remotemcp/routing/service.py
      - name: PowerShell parse preflight
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($p in @(
            ".\Start-RemoteMCP-Node.ps1",
            ".\Watch-RemoteMCP-Node.ps1",
            ".\Install-RemoteMCP-Node-Supervisor.ps1",
            ".\Migrate-RemoteMCP-Node-ZeroC.ps1"
          )) {
            [scriptblock]::Create((Get-Content -Raw $p)) | Out-Null
          }
      - name: Policy JSON parse
        run: python -c "import json; json.load(open('skills/remote-mcp/managed_execution_policy.json', encoding='utf-8'))"
