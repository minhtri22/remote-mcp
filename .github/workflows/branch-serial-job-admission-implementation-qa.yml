name: Branch serial job admission implementation QA

on:
  pull_request:
    paths:
      - "remotemcp/durable/db.py"
      - "remotemcp/multiagent/**"
      - "remotemcp/routing/**"
      - "specs/branch_serial_job_admission_schema_v4.sql"
      - "tests/v2b/**"
      - "tests/v2bd/**"
      - "tests/test_public_repo_hygiene.py"
      - "docs/REMOTEMCP_BRANCH_SERIAL_JOB_LIFECYCLE_AND_PREDECESSOR_ADMISSION_IMPLEMENTATION_STATIC_PREFLIGHT_AND_EXECUTION_LOCK.md"
      - ".github/workflows/branch-serial-job-admission-implementation-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  implementation-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install QA dependencies
        run: python -m pip install pytest "mcp[cli]<2" uvicorn httpx==0.28.1 cryptography==46.0.6
      - name: V2-B local branch-serial QA
        run: >-
          python -m pytest -q
          tests/v2b/test_branch_serial_job_admission.py
          tests/v2b/test_task_jobs.py
      - name: V2-BD routed branch-serial QA
        run: >-
          python -m pytest -q
          tests/v2bd/test_migration_004_branch_serial.py
          tests/v2bd/test_branch_serial_routed_admission.py
          tests/v2bd/test_routed_jobs.py
      - name: Public hygiene QA
        run: python -m pytest -q tests/test_public_repo_hygiene.py
