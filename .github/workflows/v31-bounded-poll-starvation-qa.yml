name: V31 Bounded Signed Poll and Managed Route Recovery QA

on:
  pull_request:
    paths:
      - "remotemcp/routing/config.py"
      - "remotemcp/routing/service.py"
      - "tests/v2bd/test_bounded_signed_poll_no_starvation.py"
      - ".github/workflows/v31-bounded-poll-starvation-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check pytest "mcp[cli]<2" uvicorn httpx==0.28.1 cryptography==46.0.6
      - name: Syntax check
        run: python -m py_compile remotemcp/routing/config.py remotemcp/routing/service.py tests/v2bd/test_bounded_signed_poll_no_starvation.py
      - name: Proxy idle timeout simulation and 6x managed read qualification
        run: python -m pytest -v tests/v2bd/test_bounded_signed_poll_no_starvation.py
      - name: Existing two-node isolation and signed reconnect regression
        run: python -m pytest -q tests/v2bd/test_loopback_gateway_node.py tests/v2bd/test_node_reconnect.py tests/test_gateway_pinned_node_dispatch_hold.py
