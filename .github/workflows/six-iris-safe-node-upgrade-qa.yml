name: SIX IRIS Safe Node Upgrade Gate QA

on:
  pull_request:
    paths:
      - "scripts/six_iris_safe_node_upgrade_gate.py"
      - "tests/test_six_iris_safe_node_upgrade_gate.py"
      - "scripts/Collect-SIX-IRIS-SafeNodeUpgradeOS.ps1"
      - ".github/workflows/six-iris-safe-node-upgrade-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated Python test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile safety assessor and tests
        run: python -m py_compile scripts/six_iris_safe_node_upgrade_gate.py tests/test_six_iris_safe_node_upgrade_gate.py
      - name: Independent frozen data adversarial QA
        run: python -m pytest -q tests/test_six_iris_safe_node_upgrade_gate.py
      - name: Windows local evidence collector static safety preflight
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'scripts/Collect-SIX-IRIS-SafeNodeUpgradeOS.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Host; exit 1 }
          $source = Get-Content -LiteralPath $path -Raw
          foreach ($forbidden in @('Stop-Process','Remove-Item','Set-Content','Start-Process','Restart-Service','Invoke-Expression','git worktree')) {
            if ($source.Contains($forbidden)) { throw "UNSAFE_MUTATION_TOKEN: $forbidden" }
          }
