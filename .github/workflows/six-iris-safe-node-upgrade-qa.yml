name: SIX IRIS Safe Node Upgrade Gate QA

on:
  pull_request:
    paths:
      - "scripts/six_iris_safe_node_upgrade_gate.py"
      - "tests/test_six_iris_safe_node_upgrade_gate.py"
      - ".github/workflows/six-iris-safe-node-upgrade-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated Python test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile safety assessor and tests
        run: python -m py_compile scripts/six_iris_safe_node_upgrade_gate.py tests/test_six_iris_safe_node_upgrade_gate.py
      - name: Independent frozen data adversarial QA
        run: python -m pytest -q tests/test_six_iris_safe_node_upgrade_gate.py
