name: Node PID Reverse Mapping Independent QA

on:
  pull_request:
    paths:
      - "remotemcp/node/process_ownership_audit.py"
      - "remotemcp/node/cli.py"
      - "tests/test_node_process_ownership_audit.py"
      - ".github/workflows/node-pid-reverse-mapping-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated QA dependencies
        run: python -m pip install --disable-pip-version-check pytest "mcp[cli]<2" uvicorn httpx==0.28.1 cryptography==46.0.6
      - name: Syntax preflight
        run: python -m py_compile remotemcp/node/process_ownership_audit.py remotemcp/node/cli.py tests/test_node_process_ownership_audit.py
      - name: Read-only command to job to PID and inverse mappings
        run: python -m pytest -q tests/test_node_process_ownership_audit.py
