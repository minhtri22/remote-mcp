name: Explicit Science Admission Zero-Science QA

on:
  pull_request:
    paths:
      - "scripts/agent-recovery/Invoke-RemoteMCP-ScienceAdmission.ps1"
      - ".github/workflows/explicit-science-admission-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-static-gate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell parser and fail-closed release contract
        shell: powershell
        run: |
          $p = Join-Path $PWD 'scripts\agent-recovery\Invoke-RemoteMCP-ScienceAdmission.ps1'
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0) {
            $errors | Format-List
            throw 'SCIENCE_ADMISSION_SYNTAX_QA_FAIL'
          }
          $s=Get-Content -LiteralPath $p -Raw
          foreach($token in @(
            "ValidateSet('Audit','Release','Verify')",
            'DEVICE_IDENTITY_OR_ROUTE_MISMATCH',
            'GATEWAY_PIN_OR_BOOLEAN_GATE_MISMATCH',
            'PINNED_NODE_MARKER_MISMATCH',
            'ACTIVE_JOB_OR_UNEXPIRED_COMMAND_HOLD',
            'REMOTEMCP_SCIENCE_ADMISSION_LOCAL_RELEASE=PASS',
            'SIGNED_REMOTE_ADMISSION_VERIFICATION=PENDING',
            'ROLLBACK_TO_QUARANTINE_PASS',
            'CRITICAL_ADMISSION_ROLLBACK_UNVERIFIED',
            '[IO.File]::Replace',
            'ReadOnlyJournal'
          )) {
            if(-not $s.Contains($token)) { throw "SCIENCE_ADMISSION_CONTRACT_MISSING: $token" }
          }
          if($s -match '(?i)device_pair_begin|job_submit\b|task_job_submit|lineage\.md') {
            throw 'SCIENCE_ADMISSION_FORBIDDEN_SCIENCE_OR_PAIRING_MUTATION'
          }
          Write-Host 'SCIENCE_ADMISSION_WINDOWS_PARSE_AND_CONTRACT=PASS'
      - name: Python pinned gateway admission regression and public hygiene
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest "mcp[cli]<2" httpx==0.28.1 cryptography==46.0.6
          python -m pytest -q tests/test_gateway_pinned_node_dispatch_hold.py tests/test_public_repo_hygiene.py
