name: Managed environment propagation QA

on:
  pull_request:
    paths:
      - "remotemcp/durable/config.py"
      - "remotemcp/durable/process.py"
      - "remotemcp/durable/worker.py"
      - "tests/v2a/test_managed_env_passthrough.py"
      - "tests/v2a/test_legacy_run_command.py"
      - "docs/REMOTEMCP_MANAGED_EXECUTION_ENVIRONMENT_PROPAGATION_STATIC_QUALIFICATION.md"
      - ".github/workflows/managed-env-propagation-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-env-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install QA dependencies
        run: python -m pip install pytest "mcp[cli]<2" uvicorn httpx==0.28.1 cryptography==46.0.6
      - name: Managed environment targeted QA
        run: python -m pytest -q tests/v2a/test_managed_env_passthrough.py
      - name: Full V2-A regression
        run: python scripts/run_v2a_tests.py
      - name: Full V2-B regression
        run: python scripts/run_v2b_tests.py
      - name: Full V2-BD regression
        run: python scripts/run_v2bd_tests.py
      - name: Python syntax
        run: python -m py_compile remotemcp/durable/config.py remotemcp/durable/process.py remotemcp/durable/worker.py
