name: Silent Startup V2 Zero-Science QA

on:
  pull_request:
    paths:
      - "scripts/silent-startup-v2/**"
      - ".github/workflows/silent-startup-v2-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts without executing them
        shell: pwsh
        run: |
          foreach ($name in @('Install-RemoteMCP-Silent-Startup.ps1','RemoteMCP-Silent-Bootstrap.ps1')) {
            $path = Join-Path $PWD "scripts/silent-startup-v2/$name"
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) {
              $errors | Format-List
              throw "SILENT_STARTUP_PARSER_FAIL: $name"
            }
            if((Get-Item $path).Length -lt 500) {
              throw "SILENT_STARTUP_EMPTY_SOURCE: $name"
            }
          }
          Write-Host 'SILENT_STARTUP_V2_SYNTAX_QA=PASS'
      - name: Fail closed contract and no science mutations
        shell: pwsh
        run: |
          $dir = Join-Path $PWD 'scripts/silent-startup-v2'
          $installer = Get-Content (Join-Path $dir 'Install-RemoteMCP-Silent-Startup.ps1') -Raw
          $bootstrap = Get-Content (Join-Path $dir 'RemoteMCP-Silent-Bootstrap.ps1') -Raw
          foreach($s in @('REMOTEMCP_SILENT_STARTUP_AUDIT=PASS','REMOTEMCP_SILENT_STARTUP_APPLY=PASS','REMOTEMCP_SILENT_STARTUP_VERIFY=PASS')) {
            if(-not $installer.Contains($s)) { throw "MISSING_RESULT_MARKER: $s" }
          }
          foreach($s in @('NODE_PRESENT_WATCHDOG_ABSENT_HOLD_NO_RESTART','GATEWAY_RELEASE_GUARD_INVALID','silent-bootstrap.jsonl','-WindowStyle Hidden')) {
            if(-not $bootstrap.Contains($s)) { throw "MISSING_BOOT_GUARD: $s" }
          }
          if($bootstrap -match '(?i)Stop-Process|device_pair_begin|job_submit|hold_science_job_dispatch\s*=\s*\$false') {
            throw 'BOOTSTRAP_FORBIDDEN_MUTATION'
          }
          if($installer -match '(?i)Stop-Process|device_pair_begin|job_submit') {
            throw 'INSTALLER_FORBIDDEN_MUTATION'
          }
          Write-Host 'SILENT_STARTUP_V2_CONTRACT_QA=PASS'
