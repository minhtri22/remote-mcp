name: RemoteMCP Node Supervisor Static QA

on:
  pull_request:
    paths:
      - "Watch-RemoteMCP-Node.ps1"
      - "Install-RemoteMCP-Node-Supervisor.ps1"
      - "tests/test_node_supervisor_scripts.py"
      - "tests/test_start_node_script.py"
      - "tests/test_public_repo_hygiene.py"
      - ".github/workflows/node-supervisor-static-qa.yml"
      - "docs/REMOTEMCP_MACHINE1_SELF_HEALING_NODE_SUPERVISOR_STATIC_PREFLIGHT_AND_DEPLOYMENT_PLAN.md"
      - "docs/REMOTEMCP_CONTROL_PLANE_READ_PATH_SQLITE_WRITE_CONTENTION_FIX_MAINTENANCE_DEPLOYMENT_PLAN.md"
  workflow_dispatch:

jobs:
  static-qa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: PowerShell parse preflight
        shell: powershell
        run: |
          [scriptblock]::Create((Get-Content -Raw .\Watch-RemoteMCP-Node.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw .\Install-RemoteMCP-Node-Supervisor.ps1)) | Out-Null
      - name: Scheduled Task construction preflight
        shell: powershell
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "paired-runtime"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $runtime "device.json") -Value '{"device_id":"dev_example","key_fingerprint_sha256":"fingerprint_example","route_generation":1}'
          Set-Content -Encoding ASCII -Path (Join-Path $runtime "device-ed25519.pem") -Value "test-only-placeholder"
          $root = Join-Path $env:RUNNER_TEMP "research-root"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          .\Install-RemoteMCP-Node-Supervisor.ps1 -RuntimeDir $runtime -RootDir $root -SourceDir $PWD -NodeSourceDir $PWD -PlanOnly
      - name: Per-user Startup fallback construction
        shell: powershell
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "paired-runtime-startup"
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $runtime "device.json") -Value '{"device_id":"dev_example_startup","key_fingerprint_sha256":"fingerprint_example","route_generation":1}'
          Set-Content -Encoding ASCII -Path (Join-Path $runtime "device-ed25519.pem") -Value "test-only-placeholder"

          $fakeSource = Join-Path $env:RUNNER_TEMP "node-source"
          New-Item -ItemType Directory -Force -Path (Join-Path $fakeSource "remotemcp\node") | Out-Null
          Set-Content -Encoding UTF8 -Path (Join-Path $fakeSource "remotemcp\node\__main__.py") -Value "# test"

          $root = Join-Path $env:RUNNER_TEMP "research-root-startup"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          # Plan-only validates exact source/runtime/root wiring without mutating persistence.
          .\Install-RemoteMCP-Node-Supervisor.ps1 -RuntimeDir $runtime -RootDir $root -SourceDir $PWD -NodeSourceDir $fakeSource -PersistenceMode Startup -PlanOnly
      - name: Targeted supervisor and hygiene QA
        run: python -m pytest -q tests/test_node_supervisor_scripts.py tests/test_start_node_script.py tests/test_public_repo_hygiene.py
