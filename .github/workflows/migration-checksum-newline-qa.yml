name: Migration checksum newline compatibility QA

on:
  pull_request:
    paths:
      - "remotemcp/durable/db.py"
      - "tests/v2a/test_db.py"
      - ".github/workflows/migration-checksum-newline-qa.yml"
  workflow_dispatch:

jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest "mcp[cli]<2" uvicorn "httpx==0.28.1" "cryptography==46.0.6"
      - name: Migration checksum compatibility tests
        run: python -m pytest -q tests/v2a/test_db.py
      - name: Read-path regression test
        run: python -m pytest -q tests/v2bd/test_device_read_path_contention.py
