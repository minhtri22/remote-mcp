name: V3 execution recovery QA

on:
  pull_request:
    branches:
      - "release/v3-production-recovery"
    paths:
      - "remotemcp/node/**"
      - "remotemcp/routing/**"
      - "server.py"
      - "skills/remote-mcp/**"
      - "tests/v2bd/test_preexecution_path_escape_recovery.py"
      - "tests/v2bd/test_postrun_evidence_readback.py"
      - ".github/workflows/v3-execution-recovery-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install QA dependencies
        run: python -m pip install pytest "mcp[cli]<2" uvicorn httpx==0.28.1 cryptography==46.0.6
      - name: Syntax preflight
        run: >-
          python -m py_compile
          server.py
          remotemcp/routing/service.py
          remotemcp/node/jobs.py
          remotemcp/node/executor.py
      - name: Targeted recovery and readback QA
        run: >-
          python -m pytest -q
          tests/v2bd/test_preexecution_path_escape_recovery.py
          tests/v2bd/test_postrun_evidence_readback.py
      - name: Full V2-B regression
        run: python scripts/run_v2b_tests.py
      - name: Full V2-BD regression
        run: python scripts/run_v2bd_tests.py
      - name: Public hygiene QA
        run: python -m pytest -q tests/test_public_repo_hygiene.py
