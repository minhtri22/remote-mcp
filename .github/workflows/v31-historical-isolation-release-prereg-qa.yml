name: V31 Expired Isolation and Node Release Prereg QA

on:
  pull_request:
    paths:
      - "docs/v31/REMOTEMCP_V31_HISTORICAL_EXPIRED_COMMAND_ISOLATION_AND_NODE_INSTRUMENTATION_RELEASE_QUALIFICATION_PREREGISTRATION.md"
      - "specs/v31/historical_expired_isolation_node_release_prereg_v1.json"
      - "tests/v31/test_historical_isolation_release_prereg_contract.py"
      - ".github/workflows/v31-historical-isolation-release-prereg-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-runtime-prereg-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax and JSON validation
        run: python -m py_compile tests/v31/test_historical_isolation_release_prereg_contract.py
      - name: Preregistration-only static and privacy contract
        run: python -m pytest -q tests/v31/test_historical_isolation_release_prereg_contract.py
      - name: Explicit nonproduction result
        run: python -c "print('V31_HISTORICAL_EXPIRED_ISOLATION_NODE_RELEASE_PREREG_STATIC=PASS; PRODUCTION_NODE_DEPLOY=FORBIDDEN; HISTORICAL_REPLAY=FORBIDDEN')"
