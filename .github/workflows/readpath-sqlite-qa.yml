name: RemoteMCP Read-Path SQLite QA

on:
  push:
    branches: [main]
    paths:
      - "remotemcp/routing/devices.py"
      - "remotemcp/routing/service.py"
      - "tests/v2bd/**"
      - "tests/v2b/**"
      - "tests/v2a/**"
      - "tests/test_baseline_contract.py"
      - "tests/test_oauth_provider_unit.py"
      - "scripts/run_v2bd_tests.py"
      - "scripts/run_v2b_tests.py"
      - "scripts/run_v2a_tests.py"
      - "scripts/run_v2_0_tests.py"
      - ".github/workflows/readpath-sqlite-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install QA dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "mcp[cli]<2" uvicorn httpx==0.28.1 cryptography==46.0.6

      - name: Freeze source identities
        shell: pwsh
        run: |
          git rev-parse HEAD
          Get-FileHash remotemcp/routing/devices.py -Algorithm SHA256
          Get-FileHash remotemcp/routing/service.py -Algorithm SHA256
          Get-FileHash tests/v2bd/test_device_read_path_contention.py -Algorithm SHA256

      - name: Targeted device read-path contention QA
        shell: pwsh
        run: |
          python -m pytest -q tests/v2bd/test_device_states.py tests/v2bd/test_device_read_path_contention.py

      - name: V2-BD regression
        shell: pwsh
        run: python scripts/run_v2bd_tests.py

      - name: V2-B regression
        shell: pwsh
        run: python scripts/run_v2b_tests.py

      - name: V2-A regression
        shell: pwsh
        run: python scripts/run_v2a_tests.py

      - name: V2-0 frozen denominator
        shell: pwsh
        run: python scripts/run_v2_0_tests.py
